# Delta-reporting PR checks.
#
# Shape: one job per TREE, not one per check. `head` and `base` each install
# once and build once, then run every check that tree can answer. They run in
# parallel with each other. `report` fans in, diffs the two, posts a single
# comment, and owns the pass/fail decision.
#
# Total cost: 2 installs, 2 builds — whatever the number of checks.
#
# CONFIGURE markers show every line that depends on the repository's toolchain.
# Delete steps for checks you did not choose.

name: PR checks

on:
  pull_request:
    branches: [main] # CONFIGURE: your base branches

# Do not add a `push` trigger to this workflow. It compares two trees, and a
# push has no base to compare against — it would run both jobs and report
# nothing. A post-merge build belongs in its own workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # A cancelled run leaves its sticky comment describing an older commit, with
  # no red X to explain why, so a PR run is never cancelled. This workflow only
  # triggers on `pull_request`, so the value is a constant.
  cancel-in-progress: false

env:
  # CONFIGURE: delete this if the repo has a `.nvmrc` — the jobs below prefer
  # `node-version-file`, so one file is the single source of truth.
  NODE_VERSION: "22"

jobs:
  # ── The PR's tree ─────────────────────────────────────────────────────
  # Install once, build once, then run everything off that one tree:
  # the static checks, the bundle measurement, the content scan, the tests.
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup MUST come before setup-node: setup-node's `cache:
      # pnpm` needs the pnpm binary to locate the store.
      #
      # No `version:` here. The action reads the `packageManager` field in
      # package.json, so the version lives in one place. Pinning it here as well
      # is the single most common way this workflow breaks — three repos in this
      # fleet have a commit fixing exactly that.
      - uses: pnpm/action-setup@v6 # CONFIGURE: your package manager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # CONFIGURE: or node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm" # CONFIGURE

      # `id` and the guard below: when the install fails, every later step is
      # measuring nothing. Skip them rather than filling the report with the
      # consequences of one failure.
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile # CONFIGURE

      # The formatter gate is scoped to the files this PR touches, so the head
      # tree has to say which those are. Two-dot diff, because the default
      # checkout for `pull_request` is the MERGE ref — base already merged in —
      # so base.sha..HEAD is exactly this PR's own changes. If you change the
      # checkout to `ref: github.event.pull_request.head.sha`, switch this to
      # the three-dot form and drop the shallow fetch, or you will pick up
      # every file that landed on base since the branch diverged.
      - name: List files this PR touches
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/out/static
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only --diff-filter=d "$BASE_SHA" HEAD |
            sort >/tmp/out/static/touched.txt
          wc -l /tmp/out/static/touched.txt

      # Checks 1–3. Read-only checks run concurrently inside the script; the
      # formatter runs last because it rewrites files.
      #
      # These run BEFORE the build and never depend on it. A branch that fails
      # to build is the branch that most needs to hear about its type errors.
      - name: Static checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/ci/collect-static.sh /tmp/out/static

      # `continue-on-error` and `tee`: a failed build is a finding to report,
      # not a reason to lose the comment. The log feeds the Build section, which
      # says whether this PR broke the build or inherited a broken base.
      #
      # CONFIGURE: a bundler that reads env vars at build time may silently
      # tree-shake dependencies away when they are missing. Dummy-but-truthy
      # values keep the build honest.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          echo "VITE_EXAMPLE_URL=http://127.0.0.1:1234" >> $GITHUB_ENV
          pnpm build 2>&1 | tee /tmp/out/build.log   # CONFIGURE

      - name: Record the build outcome
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/out
          echo "${{ steps.build.outcome }}" >/tmp/out/build.outcome

      # Check 4, head half. Measures only — the diff happens in `report`.
      - name: Measure bundle
        if: ${{ steps.build.outcome == 'success' }}
        run: node .github/ci/measure-bundle.cjs dist /tmp/out/bundle.json

      # Check 6, over the SAME dist/ the measurement just read. No second build.
      # The second argument makes the scan write a fragment, so a leak shows up
      # in the comment rather than only in a red job.
      - name: Scan build output
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/ci/scan-build.sh dist /tmp/out/fragments

      # Check 5. continue-on-error so a failure still reaches the comment.
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: pnpm test --reporter=json --outputFile=/tmp/test-results.json # CONFIGURE

      - name: Render test fragment
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node -e "require('./.github/ci/render-tests.cjs')({
            results: '/tmp/test-results.json', out: '/tmp/out/fragments'
          })"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: tree-head
          path: /tmp/out/
          retention-days: 1

  # ── The base branch's tree ────────────────────────────────────────────
  # Same install and build, but only the checks that need a comparison point.
  # No tests and no content scan here — those are head-only questions.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}

      # BEFORE setup-node, and that ordering is load-bearing. `.nvmrc` is in
      # this list, and the PR that ADDS a `.nvmrc` is by definition a PR whose
      # base branch has none — `setup-node` would die on the missing file before
      # any later step could fetch it. The same holds for a PR that bumps the
      # Node version: both trees must use the new one.
      #
      # Everything here is part of the measurement rather than part of the code.
      # The scripts, because both trees must be measured by the SAME script, or
      # a change to a script shows up as a change in the codebase. The linter,
      # formatter and TypeScript configs, because a PR that changes a rule would
      # otherwise leave the base tree judged by the old rule, so every file that
      # rule touches reads as newly broken.
      #
      # One `git checkout` per path: a single call listing all of them fails as
      # a whole when any one is missing, which would silently leave the base
      # tree measured by its own older configs.
      #
      # CONFIGURE: your linter, formatter and TypeScript config files.
      - name: Fetch the measurement from head
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git checkout "${{ github.event.pull_request.head.sha }}" -- .github/ci/
          for f in .nvmrc .oxlintrc.json .oxfmtrc.json .prettierrc.json .prettierignore tsconfig.json; do
            git checkout "${{ github.event.pull_request.head.sha }}" -- "$f" ||
              echo "no $f on head, leaving the base copy in place"
          done

      - uses: pnpm/action-setup@v6 # CONFIGURE
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # CONFIGURE
          cache: "pnpm" # CONFIGURE

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile # CONFIGURE

      - name: Static checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/ci/collect-static.sh /tmp/out/static

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          echo "VITE_EXAMPLE_URL=http://127.0.0.1:1234" >> $GITHUB_ENV
          pnpm build 2>&1 | tee /tmp/out/build.log   # CONFIGURE

      - name: Record the build outcome
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/out
          echo "${{ steps.build.outcome }}" >/tmp/out/build.outcome

      - name: Measure bundle
        if: ${{ steps.build.outcome == 'success' }}
        run: node .github/ci/measure-bundle.cjs dist /tmp/out/bundle.json

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: tree-base
          path: /tmp/out/
          retention-days: 1

  # ── Fan-in: diff, one comment, one verdict ────────────────────────────
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [head, base]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with: { name: tree-head, path: /tmp/head }
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with: { name: tree-base, path: /tmp/base }
        continue-on-error: true

      # The diff happens here, once, over artifacts. Neither tree is present.
      - name: Render fragments
        run: |
          mkdir -p /tmp/fragments
          cp -r /tmp/head/fragments/. /tmp/fragments/ 2>/dev/null || true
          node -e "require('./.github/ci/render-build.cjs')({
            head: '/tmp/head', base: '/tmp/base', out: '/tmp/fragments'
          })"
          node -e "require('./.github/ci/render-static.cjs')({
            head: '/tmp/head/static', base: '/tmp/base/static', out: '/tmp/fragments'
          })"
          node -e "require('./.github/ci/render-bundle.cjs')({
            head: '/tmp/head/bundle.json', base: '/tmp/base/bundle.json', out: '/tmp/fragments'
          })"

      - name: Post comment
        uses: actions/github-script@v9
        with:
          script: |
            const { assemble, upsertComment } = require('./.github/ci/comment.cjs')
            const body = assemble('/tmp/fragments', {
              id: 'pr-checks',
              title: '### PR checks',
              header: `_Compared against \`${context.payload.pull_request.base.ref}\`._`,
            })
            core.info(JSON.stringify(await upsertComment(github, context, 'pr-checks', body)))

      # `tee` puts the verdict on the run's summary page, so the reason a
      # required check went red is visible without opening the log.
      - name: Gate
        run: node .github/ci/gate.cjs /tmp/fragments | tee -a "$GITHUB_STEP_SUMMARY"
