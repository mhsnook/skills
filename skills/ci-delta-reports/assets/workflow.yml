# Delta-reporting PR checks.
#
# Shape: one job per TREE, not one per check. `head` and `base` each install
# once and build once, then run every check that tree can answer. They run in
# parallel with each other. `report` fans in, diffs the two, posts a single
# comment, and owns the pass/fail decision.
#
# Total cost: 2 installs, 2 builds — whatever the number of checks.
#
# This file is a SHELL. Every step is a single call into a versioned script
# under .github/ci/, and nothing here is more than one line of logic. Two
# reasons, and the second one is the one that matters:
#
#   1. A workflow file is edited under a different review posture than code —
#      changing the report should not mean touching CI plumbing.
#   2. A workflow file can name any secret in the repository. A script can only
#      see what a step hands it through `env:`. Keeping logic in the scripts
#      means the day-to-day edits happen in files with no access to secrets at
#      all, and the small blast-radius surface stays small.
#
# So when a step needs to grow: add it to a script, not to this file.
#
# CONFIGURE markers show every line that depends on the repository's toolchain.
# Delete steps for checks you did not choose.

name: PR checks

on:
  pull_request:
    branches: [main] # CONFIGURE: your base branches

# Every push to a PR branch supersedes the run before it. Without this, a
# branch pushed three times runs three full head+base matrices, and the two
# losers race the winner to write the same comment — the last writer wins, and
# it may be the oldest run. Grouping by PR number rather than by `head_ref`
# keeps two forks that both branched `patch-1` from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. Only `report` widens this, and only to what it needs.
permissions:
  contents: read

env:
  NODE_VERSION: "22" # CONFIGURE

jobs:
  # ── The PR's tree ─────────────────────────────────────────────────────
  # Install once, build once, then run everything off that one tree:
  # the static checks, the bundle measurement, the content scan, the tests.
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # CONFIGURE: your package manager
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm" # CONFIGURE

      - name: Install
        run: pnpm install --frozen-lockfile # CONFIGURE

      # Feeds the formatter gate, which is scoped to the files this PR touches.
      # Drop this step if formatting is report-only.
      - name: List files this PR touches
        run: bash .github/ci/list-touched.sh "${{ github.event.pull_request.base.sha }}" /tmp/out/static

      # Checks 1–3. Read-only checks run concurrently inside the script; the
      # formatter runs last because it rewrites files.
      - name: Static checks
        run: bash .github/ci/collect-static.sh /tmp/out/static

      # CONFIGURE: a bundler that reads env vars at build time may silently
      # tree-shake dependencies away when they are missing. Dummy-but-truthy
      # values keep the build honest.
      #
      # A build that needs a real secret names it here, on this one step, and
      # nowhere else — the scripts read it out of the environment they are
      # given. Never interpolate `${{ secrets.* }}` into a `run:` string; that
      # bakes the value into the command line, where it reaches process lists
      # and error output.
      - name: Build
        env:
          VITE_EXAMPLE_URL: http://127.0.0.1:1234 # CONFIGURE
        run: pnpm build # CONFIGURE

      # Check 4, head half. Measures only — the diff happens in `report`.
      - name: Measure bundle
        run: node .github/ci/measure-bundle.cjs dist /tmp/out/bundle.json

      # Check 6, over the SAME dist/ the measurement just read. No second build.
      - name: Scan build output
        run: bash .github/ci/scan-build.sh dist

      # Check 5. continue-on-error so a failure still reaches the comment.
      - name: Tests
        continue-on-error: true
        run: pnpm test --reporter=json --outputFile=/tmp/test-results.json # CONFIGURE

      - name: Render test fragment
        if: ${{ !cancelled() }}
        run: node .github/ci/render-tests.cjs /tmp/test-results.json /tmp/out/fragments

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tree-head
          path: /tmp/out/
          retention-days: 1

  # ── The base branch's tree ────────────────────────────────────────────
  # Same install and build, but only the checks that need a comparison point.
  # No tests and no content scan here — those are head-only questions.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - uses: pnpm/action-setup@v4 # CONFIGURE
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm" # CONFIGURE

      - name: Install
        run: pnpm install --frozen-lockfile # CONFIGURE

      # The script lives on the head branch, so fetch it rather than using the
      # base branch's copy. Both trees must be measured by the SAME script, or
      # a change to the script itself shows up as a change in the codebase.
      - name: Fetch check scripts from head
        run: bash .github/ci/fetch-scripts.sh "${{ github.event.pull_request.head.sha }}"

      - name: Static checks
        run: bash .github/ci/collect-static.sh /tmp/out/static

      - name: Build
        env:
          VITE_EXAMPLE_URL: http://127.0.0.1:1234 # CONFIGURE
        run: pnpm build # CONFIGURE

      - name: Measure bundle
        run: node .github/ci/measure-bundle.cjs dist /tmp/out/bundle.json

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tree-base
          path: /tmp/out/
          retention-days: 1

  # ── Fan-in: diff, one comment, one verdict ────────────────────────────
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [head, base]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: tree-head, path: /tmp/head }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: tree-base, path: /tmp/base }
        continue-on-error: true

      # The diff happens here, once, over artifacts. Neither tree is present.
      - name: Render fragments
        run: node .github/ci/render-report.cjs /tmp/head /tmp/base /tmp/fragments

      # github-script exists only to hand the authenticated octokit to a
      # script. The token never appears in this file.
      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: await require('./.github/ci/post-comment.cjs')({ github, context, core })

      - name: Gate
        run: node .github/ci/gate.cjs /tmp/fragments
